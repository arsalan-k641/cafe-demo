<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        h1, h2 { color: #4a3b32; text-align: center; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        ul { margin: 5px 0; padding-right: 20px; }
        button { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #218838; }
        .completed { background: #e9ecef; opacity: 0.8; }
        .section-title { margin-top: 40px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>پنل مدیریت سفارشات کافه</h1>

    <h2 class="section-title">سفارشات جدید و در حال پردازش</h2>
    <div id="active-orders">در حال بارگذاری سفارشات...</div>

    <h2 class="section-title">تاریخچه فاکتورها و رسیدها</h2>
    <div id="receipts-list">در حال بارگذاری رسیدها...</div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBg0db4HZtFPMp7nbnQLsLhsgWov3Lw7v0",
        authDomain: "cafe-demo-36532.firebaseapp.com",
        databaseURL: "https://cafe-demo-36532-default-rtdb.firebaseio.com",
        projectId: "cafe-demo-36532",
        storageBucket: "cafe-demo-36532.firebasestorage.app",
        messagingSenderId: "139708235074",
        appId: "1:139708235074:web:0421f58c576b0f48149cdb",
        measurementId: "G-PXSMYHJEWP"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const activeOrdersDiv = document.getElementById('active-orders');
    const receiptsListDiv = document.getElementById('receipts-list');

    onValue(ref(db, 'orders'), (snapshot) => {
        const data = snapshot.val();
        activeOrdersDiv.innerHTML = '';
        receiptsListDiv.innerHTML = '';

        if (!data) {
            activeOrdersDiv.innerHTML = '<p>سفارشی وجود ندارد.</p>';
            receiptsListDiv.innerHTML = '<p>رسیدی ثبت نشده است.</p>';
            return;
        }

        let activeHtml = '';
        let receiptHtml = '';

        Object.keys(data).forEach(id => {
            const order = data[id];
            let itemsList = '';
            order.items.forEach(item => {
                itemsList += `<li>${item.name} (تعداد: ${item.qty}) - ${item.price.toLocaleString()} تومان</li>`;
            });

            const cardContent = `
                <div class="card ${order.status === 'تکمیل شده' ? 'completed' : ''}">
                    <div class="order-header">
                        <span>میز شماره: ${order.tableNumber}</span>
                        <span>وضعیت: ${order.status}</span>
                    </div>
                    <ul>${itemsList}</ul>
                    <p><strong>مجموع مبلغ:</strong> ${order.totalPrice.toLocaleString()} تومان</p>
                    ${order.status === 'در انتظار تایید' ? `<button onclick="acceptOrder('${id}')">تایید و آماده‌سازی</button>` : ''}
                    ${order.status === 'آماده‌سازی' ? `<button onclick="completeOrder('${id}')" style="background:#007bff;">تکمیل و ثبت در فاکتورها</button>` : ''}
                </div>
            `;

            if (order.status === 'تکمیل شده') {
                receiptHtml += cardContent;
            } else {
                activeHtml += cardContent;
            }
        });

        activeOrdersDiv.innerHTML = activeHtml || '<p>سفارش فعالی وجود ندارد.</p>';
        receiptsListDiv.innerHTML = receiptHtml || '<p>فاکتور بسته‌شده‌ای وجود ندارد.</p>';
    });

    window.acceptOrder = function(orderId) {
        update(ref(db, `orders/${orderId}`), { status: 'آماده‌سازی' });
    }

    window.completeOrder = function(orderId) {
        update(ref(db, `orders/${orderId}`), { status: 'تکمیل شده' });
    }
</script>

</body>
</html>
