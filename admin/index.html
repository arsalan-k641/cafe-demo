<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت کافه مهر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--bg:#0f0d0b;--surface:#1a1714;--surface2:#23201b;--surface3:#2e2924;--accent:#c8956c;--accent-hover:#daa882;--accent-dim:rgba(200,149,108,.12);--fg:#ede6dd;--fg2:#b0a899;--muted:#736b60;--success:#4caf50;--success-dim:rgba(76,175,80,.12);--danger:#e53935;--danger-dim:rgba(229,57,53,.12);--border:#302a22;--radius:12px}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
        .status-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;font-size:12px;text-align:center;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px}
        .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s}
        .status-dot.ok{background:var(--success);box-shadow:0 0 6px rgba(76,175,80,.5)}
        .status-dot.err{background:var(--danger)}
        .ahdr{position:sticky;top:34px;z-index:50;background:rgba(15,13,11,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
        .ahdr h1{font-size:20px;font-weight:900}
        .ahdr h1 i{color:var(--accent);margin-left:8px}
        .back{color:var(--fg2);text-decoration:none;font-size:14px;display:flex;align-items:center;gap:6px;transition:color .2s}
        .back:hover{color:var(--fg)}
        .tabs{display:flex;gap:4px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:88px;z-index:40}
        .tbtn{padding:10px 20px;border:none;border-radius:8px;background:0 0;color:var(--fg2);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px}
        .tbtn:hover{background:var(--surface2);color:var(--fg)}
        .tbtn.on{background:var(--accent-dim);color:var(--accent);font-weight:700}
        .tbadge{background:var(--danger);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
        .tbadge.h{display:none}
        .content{padding:20px;max-width:900px;margin:0 auto}
        .tc{display:none}.tc.on{display:block}
        .empty{text-align:center;padding:80px 20px;color:var(--muted)}
        .empty i{font-size:48px;margin-bottom:16px;display:block;opacity:.2}
        .oc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;animation:fu .3s ease-out;transition:border-color .3s}
        .oc.hl{border-color:var(--accent);box-shadow:0 0 20px var(--accent-dim)}
        @keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
        .ot{font-size:17px;font-weight:800}.ot span{color:var(--accent)}
        .otime{font-size:13px;color:var(--muted);direction:ltr}
        .oi{display:flex;justify-content:space-between;padding:6px 0;font-size:14px;border-bottom:1px dashed rgba(48,42,34,.8)}
        .oi:last-child{border-bottom:none}
        .oq{color:var(--muted);font-weight:600;margin:0 6px}
        .op{color:var(--accent);font-weight:600;direction:ltr}
        .otot{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);margin-bottom:14px;font-size:17px;font-weight:900}
        .otot span:last-child{color:var(--accent)}
        .oacts{display:flex;gap:8px}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:8px;border:none;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
        .btn:active{transform:scale(.96)}
        .b-acc{background:var(--success);color:#fff;flex:1}.b-acc:hover{background:#43a047}
        .b-done{background:var(--accent);color:#1a1410;flex:1}.b-done:hover{background:var(--accent-hover)}
        .b-rej{background:var(--danger-dim);color:var(--danger)}.b-rej:hover{background:var(--danger);color:#fff}
        .rc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:14px;animation:fu .3s ease-out}
        .rh{background:var(--surface2);padding:16px 20px;text-align:center;border-bottom:2px dashed var(--border)}
        .rh h3{font-size:18px;font-weight:900;margin-bottom:2px}
        .rh small{color:var(--muted);font-size:13px}
        .rb{padding:16px 20px}
        .rm{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;font-size:13px}
        .rm span{color:var(--muted)}.rm strong{color:var(--fg)}
        .rf{display:flex;justify-content:space-between;padding:12px 20px;border-top:2px dashed var(--border);font-size:17px;font-weight:900}
        .rf span:last-child{color:var(--accent)}
        .sbar{display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap}
        .si{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;text-align:center}
        .sv{font-size:22px;font-weight:900;color:var(--accent)}
        .sl{font-size:13px;color:var(--muted);margin-top:4px}
        .err-box{text-align:center;padding:40px 20px}
        .err-box i{font-size:48px;color:var(--danger);margin-bottom:16px;display:block}
        .err-box p{font-size:14px;color:var(--fg2);margin-top:8px;line-height:1.8}
        @media(max-width:600px){.oacts{flex-direction:column}.sbar{flex-direction:column}}
    </style>
</head>
<body>

<div class="status-bar">
    <span class="status-dot" id="sDot"></span>
    <span id="sTxt">در حال اتصال...</span>
</div>

<header class="ahdr">
    <h1><i class="fa-solid fa-gauge-high"></i>پنل مدیریت</h1>
    <a class="back" href="../index.html"><i class="fa-solid fa-arrow-right"></i>بازگشت به منو</a>
</header>

<div class="tabs">
    <button class="tbtn on" data-t="active" onclick="window._stab('active')"><i class="fa-solid fa-bell"></i>سفارشات فعال<span class="tbadge h" id="bAct">0</span></button>
    <button class="tbtn" data-t="done" onclick="window._stab('done')"><i class="fa-solid fa-receipt"></i>رسیدها</button>
</div>

<div class="content">
    <div class="tc on" id="tActive"><div class="empty"><i class="fa-solid fa-satellite-dish"></i><p>در حال دریافت سفارشات از Firebase...</p></div></div>
    <div class="tc" id="tDone"><div class="empty"><i class="fa-solid fa-receipt"></i><p>هنوز رسیدی صادر نشده</p></div></div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,update,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const fb={apiKey:"AIzaSyBg0db4HZtFPMp7nbnQLsLhsgWov3Lw7v0",authDomain:"cafe-demo-36532.firebaseapp.com",databaseURL:"https://cafe-demo-36532-default-rtdb.firebaseio.com",projectId:"cafe-demo-36532",storageBucket:"cafe-demo-36532.firebasestorage.app",messagingSenderId:"139708235074",appId:"1:139708235074:web:0421f58c576b0f48149cdb",measurementId:"G-PXSMYHJEWP"};
const db=getDatabase(initializeApp(fb));

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fp=p=>fa(p.toLocaleString('en-US'))+' تومان';
const ta=ts=>{const m=Math.floor((Date.now()-ts)/60000);if(m<1)return 'همین الان';if(m<60)return fa(m)+' دقیقه پیش';return fa(Math.floor(m/60))+' ساعت پیش'};
const fd=ts=>new Date(ts).toLocaleString('fa-IR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

function playSound(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[880,1100].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=f;g.gain.value=.15;o.start(c.currentTime+i*.15);o.stop(c.currentTime+i*.15+.12)})}catch(e){}}

// === تابع سازگار: هر ساختاری را هندل می‌کند ===
function parseOrder(id, o) {
    // استخراج آیتم‌ها: ممکن است آرایه باشد یا شیء تکی
    let items = [];
    if (Array.isArray(o.items)) {
        items = o.items;
    } else if (o.item && typeof o.item === 'string') {
        // ساختار قدیمی: {item: "اسپرسو", table: "5", time: "..."}
        items = [{ name: o.item, qty: 1, price: 0 }];
    }

    // استخراج شماره میز
    const tableNum = o.tableNumber || o.table || '?';

    // استخراج قیمت کل
    const totalPrice = o.totalPrice || o.total || items.reduce((s, it) => s + (it.price || 0), 0);

    // استخراج وضعیت
    const status = o.status || 'در انتظار تایید';

    // استخراج زمان
    const timestamp = o.timestamp || Date.now();

    return { id, items, tableNum, totalPrice, status, timestamp, completedAt: o.completedAt };
}

// === تشخیص وضعیت ===
function isCompleted(o) {
    return o.status === 'تکمیل شده' || o.status === 'completed';
}

// وضعیت اتصال
onValue(ref(db,'.info/connected'),s=>{
    const d=document.getElementById('sDot'),t=document.getElementById('sTxt');
    if(s.val()===true){d.className='status-dot ok';t.textContent='متصل به Firebase — بروزرسانی لحظه‌ای'}
    else{d.className='status-dot err';t.textContent='قطع اتصال'}
});

// گوش دادن به سفارشات
let prevKeys = [];

onValue(ref(db,'orders'),snap=>{
    const raw = snap.val();
    const actDiv = document.getElementById('tActive');
    const doneDiv = document.getElementById('tDone');

    if (!raw) {
        actDiv.innerHTML = '<div class="empty"><i class="fa-solid fa-check-circle"></i><p>سفارشی وجود ندارد</p></div>';
        doneDiv.innerHTML = '<div class="empty"><i class="fa-solid fa-receipt"></i><p>رسیدی صادر نشده</p></div>';
        document.getElementById('bAct').classList.add('h');
        return;
    }

    // پارس همه سفارشات
    const allOrders = Object.keys(raw).map(id => parseOrder(id, raw[id]));
    const currentKeys = allOrders.map(o => o.id);

    // صدای اعلان برای سفارشات جدید
    const newKeys = currentKeys.filter(k => !prevKeys.includes(k));
    if (newKeys.length > 0) playSound();
    prevKeys = currentKeys;

    // تفکیک
    const active = allOrders.filter(o => !isCompleted(o)).sort((a,b) => b.timestamp - a.timestamp);
    const done = allOrders.filter(o => isCompleted(o)).sort((a,b) => (b.completedAt||b.timestamp) - (a.completedAt||a.timestamp));

    // بج
    const badge = document.getElementById('bAct');
    badge.textContent = fa(active.length);
    badge.classList.toggle('h', active.length === 0);

    // رندر سفارشات فعال
    if (active.length === 0) {
        actDiv.innerHTML = '<div class="empty"><i class="fa-solid fa-check-circle"></i><p>سفارش فعالی وجود ندارد</p></div>';
    } else {
        actDiv.innerHTML = active.map(o => {
            const itemsHtml = o.items.map(it => `
                <div class="oi">
                    <span>${it.name}<span class="oq">×${fa(it.qty)}</span></span>
                    <span class="op">${fp(it.price)}</span>
                </div>`).join('');

            let acts = '';
            if (o.status === 'در انتظار تایید' || o.status === 'pending') {
                acts = `<div class="oacts">
                    <button class="btn b-acc" onclick="window._acc('${o.id}')"><i class="fa-solid fa-check"></i>تایید و آماده‌سازی</button>
                    <button class="btn b-rej" onclick="window._rej('${o.id}')"><i class="fa-solid fa-times"></i>رد</button>
                </div>`;
            } else if (o.status === 'آماده‌سازی' || o.status === 'preparing') {
                acts = `<div class="oacts">
                    <button class="btn b-done" onclick="window._done('${o.id}')"><i class="fa-solid fa-utensils"></i>آماده شد — صدور رسید</button>
                </div>`;
            }

            return `<div class="oc ${o.status==='در انتظار تایید'||o.status==='pending'?'hl':''}">
                <div class="oh">
                    <div class="ot">میز <span>${fa(o.tableNum)}</span></div>
                    <div class="otime">${ta(o.timestamp)}</div>
                </div>
                <div class="order-items">${itemsHtml}</div>
                <div class="otot"><span>جمع کل</span><span>${fp(o.totalPrice)}</span></div>
                ${acts}
            </div>`;
        }).join('');
    }

    // رندر رسیدها
    const totalRev = done.reduce((s, o) => s + o.totalPrice, 0);
    if (done.length === 0) {
        doneDiv.innerHTML = '<div class="empty"><i class="fa-solid fa-receipt"></i><p>هنوز رسیدی صادر نشده</p></div>';
    } else {
        doneDiv.innerHTML = `
            <div class="sbar">
                <div class="si"><div class="sv">${fa(done.length)}</div><div class="sl">تعداد رسید</div></div>
                <div class="si"><div class="sv">${fp(totalRev)}</div><div class="sl">جمع فروش</div></div>
            </div>
            ${done.map(o => {
                const oid = o.id.slice(-6).toUpperCase();
                const ct = o.completedAt || o.timestamp;
                const itemsHtml = o.items.map(it => `
                    <div class="oi">
                        <span>${it.name}<span class="oq">×${fa(it.qty)}</span></span>
                        <span class="op">${fp(it.price)}</span>
                    </div>`).join('');
                return `<div class="rc">
                    <div class="rh"><h3>کافه مهر</h3><small>رسید پرداخت</small></div>
                    <div class="rb">
                        <div class="rm">
                            <div><span>شماره: </span><strong>#${oid}</strong></div>
                            <div><span>میز: </span><strong>${fa(o.tableNum)}</strong></div>
                            <div><span>تاریخ: </span><strong>${fd(ct)}</strong></div>
                            <div><span>وضعیت: </span><strong style="color:var(--success)">تکمیل</strong></div>
                        </div>
                        <div class="order-items">${itemsHtml}</div>
                    </div>
                    <div class="rf"><span>جمع کل</span><span>${fp(o.totalPrice)}</span></div>
                </div>`;
            }).join('')}`;
    }

}, err => {
    document.getElementById('sDot').className = 'status-dot err';
    document.getElementById('sTxt').textContent = 'خطا: ' + err.message;
    document.getElementById('tActive').innerHTML = `
        <div class="err-box">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <p style="font-size:18px;font-weight:700;color:var(--danger)">خطا در اتصال به Firebase</p>
            <p>${err.message}</p>
            <p style="margin-top:16px">مطمئن شوید Rules دیتابیس باز است:<br>
            <code style="background:var(--surface2);padding:4px 8px;border-radius:4px;font-size:12px;direction:ltr;display:inline-block;margin-top:8px">{".read":true,".write":true}</code></p>
        </div>`;
    console.error('Firebase error:', err);
});

// عملیات
window._acc=function(id){update(ref(db,'orders/'+id),{status:'آماده‌سازی'}).catch(e=>alert('خطا: '+e.message))};
window._rej=function(id){if(confirm('رد سفارش؟'))remove(ref(db,'orders/'+id)).catch(e=>alert('خطا: '+e.message))};
window._done=function(id){update(ref(db,'orders/'+id),{status:'تکمیل شده',completedAt:Date.now()}).catch(e=>alert('خطا: '+e.message))};

// تب‌ها
window._stab=function(t){
    document.querySelectorAll('.tbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
    document.querySelectorAll('.tc').forEach(c=>c.classList.toggle('on',c.id==='t'+(t==='active'?'Active':'Done')));
};
</script>
</body>
</html>
