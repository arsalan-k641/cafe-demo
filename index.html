<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه مهر</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root{--bg:#141210;--surface:#1c1915;--surface2:#252119;--surface3:#302a22;--accent:#c8956c;--accent-hover:#daa882;--accent-dim:rgba(200,149,108,.12);--fg:#ede6dd;--fg2:#b0a899;--muted:#736b60;--success:#4caf50;--danger:#e53935;--border:#332d25;--radius:12px}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;padding-bottom:40px}
        body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 10%,rgba(200,149,108,.06) 0%,transparent 60%),radial-gradient(ellipse at 70% 90%,rgba(200,149,108,.03) 0%,transparent 50%);pointer-events:none;z-index:0}
        .status-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:8px 16px;font-size:12px;text-align:center;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px}
        .status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s}
        .status-dot.ok{background:var(--success);box-shadow:0 0 6px rgba(76,175,80,.5)}
        .status-dot.err{background:var(--danger)}
        header{position:relative;z-index:1;text-align:center;padding:60px 20px 20px}
        header h1{font-size:28px;font-weight:900;margin-bottom:4px}
        header h1 i{color:var(--accent);margin-left:10px}
        header p{color:var(--muted);font-size:14px}
        .main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:0 16px}
        .form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px}
        .form-card label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;color:var(--fg2)}
        .form-card input[type=number]{width:100%;padding:14px 16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--fg);font-family:inherit;font-size:18px;font-weight:700;text-align:center;outline:none;transition:border-color .2s;-moz-appearance:textfield}
        .form-card input::-webkit-outer-spin-button,.form-card input::-webkit-inner-spin-button{-webkit-appearance:none}
        .form-card input:focus{border-color:var(--accent)}
        .sec-title{font-size:18px;font-weight:800;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
        .sec-title i{color:var(--accent);font-size:16px}
        .mi{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
        .mi:last-child{border-bottom:none}
        .mi-info{flex:1}
        .mi-name{font-size:15px;font-weight:700;margin-bottom:2px}
        .mi-price{font-size:13px;color:var(--accent);font-weight:600}
        .qty-box{display:flex;align-items:center;background:var(--surface2);border-radius:8px;overflow:hidden;border:1px solid var(--border)}
        .qty-box button{width:36px;height:36px;border:none;background:0 0;color:var(--fg2);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .15s}
        .qty-box button:hover{background:var(--surface3);color:var(--fg)}
        .qty-box span{width:40px;text-align:center;font-size:15px;font-weight:800}
        .cart-sum{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-top:20px;position:sticky;bottom:16px;display:none}
        .cr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:14px}
        .cr.total{font-size:18px;font-weight:900;padding-top:12px;border-top:1px solid var(--border);margin-top:4px;margin-bottom:16px}
        .cr.total span:last-child{color:var(--accent)}
        .btn-sub{width:100%;padding:16px;border:none;background:var(--accent);color:#1a1410;font-family:inherit;font-size:16px;font-weight:800;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn-sub:hover{background:var(--accent-hover);transform:translateY(-1px)}
        .btn-sub:active{transform:scale(.98)}
        .btn-sub:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .toast{position:fixed;top:40px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--success);color:#fff;padding:16px 28px;border-radius:8px;font-size:15px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);z-index:200;opacity:0;transition:all .4s;pointer-events:none;display:flex;align-items:center;gap:10px}
        .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
        .alink{display:block;text-align:center;margin-top:30px;font-size:12px;color:var(--muted);opacity:.4;text-decoration:none;transition:opacity .2s}
        .alink:hover{opacity:.8}
    </style>
</head>
<body>

<div class="status-bar">
    <span class="status-dot" id="sDot"></span>
    <span id="sTxt">در حال اتصال...</span>
</div>

<header>
    <h1><i class="fa-solid fa-mug-saucer"></i>کافه مهر</h1>
    <p>سفارش خود را ثبت کنید</p>
</header>

<div class="main">
    <div class="form-card">
        <label for="tbl"><i class="fa-solid fa-chair" style="margin-left:6px;color:var(--accent)"></i>شماره میز شما</label>
        <input type="number" id="tbl" placeholder="مثلاً ۵" min="1" max="999">
    </div>
    <div class="sec-title"><i class="fa-solid fa-list"></i>منوی سفارش</div>
    <div class="form-card" id="menuList"></div>
    <div class="cart-sum" id="cartSum">
        <div class="cr"><span>تعداد آیتم</span><span id="iCnt">۰</span></div>
        <div class="cr total"><span>جمع کل</span><span id="tPrice">۰ تومان</span></div>
        <button class="btn-sub" id="subBtn" onclick="doSubmit()"><i class="fa-solid fa-paper-plane"></i>ثبت سفارش</button>
    </div>
    <a class="alink" href="admin/index.html">پنل مدیریت</a>
</div>

<div class="toast" id="toast"><i class="fa-solid fa-circle-check"></i>سفارش با موفقیت ثبت شد!</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,push,onValue}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const fb={apiKey:"AIzaSyBg0db4HZtFPMp7nbnQLsLhsgWov3Lw7v0",authDomain:"cafe-demo-36532.firebaseapp.com",databaseURL:"https://cafe-demo-36532-default-rtdb.firebaseio.com",projectId:"cafe-demo-36532",storageBucket:"cafe-demo-36532.firebasestorage.app",messagingSenderId:"139708235074",appId:"1:139708235074:web:0421f58c576b0f48149cdb",measurementId:"G-PXSMYHJEWP"};
const db=getDatabase(initializeApp(fb));

const items=[
    {name:'اسپرسو',price:45000},{name:'دوبل اسپرسو',price:55000},
    {name:'آمریکانو',price:55000},{name:'لاته',price:75000},
    {name:'کاپوچینو',price:75000},{name:'موکا',price:85000},
    {name:'آیس لته',price:85000},{name:'چای ماسالا',price:45000},
    {name:'دمنوش بابونه',price:35000},{name:'لیموناد تازه',price:55000},
    {name:'شیک شکلاتی',price:90000},{name:'تیرامیسو',price:120000},
    {name:'چیزکیک',price:110000},{name:'کروسان',price:65000},
    {name:'ساندویچ مرغ',price:145000},{name:'سالاد سزار',price:110000},
    {name:'سیب‌زمینی سرخ‌کرده',price:65000}
];

const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const fp=p=>fa(p.toLocaleString('en-US'))+' تومان';

// رندر منو
const ml=document.getElementById('menuList');
ml.innerHTML=items.map((it,i)=>`
<div class="mi">
    <div class="mi-info"><div class="mi-name">${it.name}</div><div class="mi-price">${fp(it.price)}</div></div>
    <div class="qty-box">
        <button onclick="window._cq(${i},1)">+</button>
        <span id="q${i}">۰</span>
        <button onclick="window._cq(${i},-1)">−</button>
    </div>
</div>`).join('');

const qt=items.map(()=>0);

window._cq=function(i,d){
    qt[i]=Math.max(0,qt[i]+d);
    document.getElementById('q'+i).textContent=fa(qt[i]);
    upd();
};

function upd(){
    let c=0,t=0;
    items.forEach((it,i)=>{c+=qt[i];t+=qt[i]*it.price});
    const s=document.getElementById('cartSum');
    if(c>0){s.style.display='block';document.getElementById('iCnt').textContent=fa(c);document.getElementById('tPrice').textContent=fp(t)}
    else s.style.display='none';
}

window.doSubmit=function(){
    const tn=document.getElementById('tbl').value.trim();
    if(!tn||+tn<1){alert('لطفاً شماره میز را وارد کنید');return}
    let orderItems=[],total=0;
    items.forEach((it,i)=>{if(qt[i]>0){orderItems.push({name:it.name,qty:qt[i],price:it.price*qt[i]});total+=it.price*qt[i]}});
    if(!orderItems.length){alert('حداقل یک آیتم انتخاب کنید');return}
    const btn=document.getElementById('subBtn');
    btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ارسال...';
    push(ref(db,'orders'),{tableNumber:tn,items:orderItems,totalPrice:total,status:'در انتظار تایید',timestamp:Date.now()})
    .then(()=>{
        document.getElementById('toast').classList.add('show');
        setTimeout(()=>document.getElementById('toast').classList.remove('show'),3000);
        document.getElementById('tbl').value='';
        qt.fill(0);items.forEach((_,i)=>document.getElementById('q'+i).textContent='۰');upd();
    })
    .catch(e=>alert('خطا: '+e.message))
    .finally(()=>{btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> ثبت سفارش'});
};

// وضعیت اتصال
onValue(ref(db,'.info/connected'),s=>{
    const d=document.getElementById('sDot'),t=document.getElementById('sTxt');
    if(s.val()===true){d.className='status-dot ok';t.textContent='متصل به سرور'}
    else{d.className='status-dot err';t.textContent='قطع اتصال'}
});
</script>
</body>
</html>
