<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منوی کافه</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f9; text-align: center; }
        .card { background: white; padding: 15px; margin: 10px auto; max-width: 300px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; }
        input { padding: 8px; margin-bottom: 10px; width: 80%; }
    </style>
</head>
<body>

    <h1>☕ منوی کافه</h1>

    <div class="card">
        <label>شماره میز:</label><br><br>
        <input type="number" id="tableNum" placeholder="مثلاً: 5">
    </div>

    <div class="card">
        <h3>اسپرسو</h3>
        <p>قیمت: ۵۰,۰۰۰ تومان</p>
        <button onclick="sendOrder('اسپرسو')">سفارش اسپرسو</button>
    </div>

    <div class="card">
        <h3>کیک شکلاتی</h3>
        <p>قیمت: ۸۰,۰۰۰ تومان</p>
        <button onclick="sendOrder('کیک شکلاتی')">سفارش کیک</button>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ کلیدهای Firebase را اینجا جایگزین کنید
        const firebaseConfig = {
            databaseURL: "https://cafe-demo-36532-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function sendOrder(itemName) {
            const table = document.getElementById('tableNum').value;
            if(!table) {
                alert('لطفا شماره میز را وارد کنید');
                return;
            }

            // ذخیره سفارش در فایربیس
            database.ref('orders').push({
                item: itemName,
                table: table,
                time: new Date().toLocaleTimeString('fa-IR')
            });

            alert('سفارش شما ثبت شد!');
        }
    </script>
</body>
</html>
