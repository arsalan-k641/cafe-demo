<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل سفارشات کافه</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #222; color: #fff; }
        .order-box { background: #333; border-right: 5px solid #28a745; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <h1>📥 سفارشات دریافتی</h1>
    <div id="ordersList">در حال دریافت سفارشات...</div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ⚠️ همان کلیدهای Firebase را اینجا قرار دهید
        const firebaseConfig = {
            databaseURL: "https://cafe-demo-36532-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ordersList = document.getElementById('ordersList');

        // گوش دادن آنلاین به تغییرات دیتابیس
        database.ref('orders').on('value', (snapshot) => {
            ordersList.innerHTML = '';
            const data = snapshot.val();
            
            if (!data) {
                ordersList.innerHTML = 'هنوز سفارشی ثبت نشده است.';
                return;
            }

            Object.keys(data).reverse().forEach(key => {
                const order = data[key];
                ordersList.innerHTML += `
                    <div class="order-box">
                        <h3>میز شماره: ${order.table}</h3>
                        <p>سفارش: <strong>${order.item}</strong></p>
                        <small>زمان: ${order.time}</small>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
